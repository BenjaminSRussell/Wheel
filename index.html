<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Decision Wheel</title>
    <link
      rel="preload"
      href="/src/main.js"
      as="script"
      crossorigin="anonymous"
    />
    <meta name="description" content="Decision Wheel" />
    <meta name="theme-color" content="#0a0a0a" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23ff6b6b'/><text x='50' y='60' text-anchor='middle' font-size='30' fill='white'>W</text></svg>"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --primary-bg: #0a0a0a;
        --text-primary: #ffffff;
        --accent-gradient: linear-gradient(
          45deg,
          #ff6b6b,
          #4ecdc4,
          #45b7d1,
          #96ceb4,
          #feca57,
          #ff9ff3,
          #54a0ff,
          #5f27cd
        );
        --button-shadow:
          0 15px 35px rgba(0, 0, 0, 0.3), 0 5px 15px rgba(0, 0, 0, 0.2);
        --button-shadow-hover:
          0 20px 40px rgba(0, 0, 0, 0.4), 0 10px 20px rgba(0, 0, 0, 0.3);
      }

      body {
        margin: 0;
        overflow: hidden;
        background: radial-gradient(
          ellipse at center,
          #0a0a0a 0%,
          #1a0a00 100%
        );
        font-family: "Comic Sans MS", "Segoe UI", Arial, sans-serif;
        height: 100vh;
        position: relative;
        color: var(--text-primary);
      }

      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: pointer;
      }

      #spinButton {
        position: fixed;
        left: 50%;
        transform: translateX(-50%);
        padding: 20px 50px;
        font-size: 28px;
        font-weight: 900;
        color: var(--text-primary);
        background: linear-gradient(135deg, #ff6600, #cc5200);
        border: 6px solid var(--text-primary);
        border-radius: 40px;
        cursor: pointer;
        box-shadow:
          0 0 30px rgba(255, 102, 0, 0.8),
          0 10px 25px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.3);
        z-index: 9999;
        display: block;
        text-transform: uppercase;
        letter-spacing: 2px;
        text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        animation: halloweenPulse 2s ease-in-out infinite;
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        overflow: visible;
        bottom: calc(80px + env(safe-area-inset-bottom, 0px));
        min-width: 250px;
        max-width: 90vw;
        white-space: nowrap;
      }

      #spinButton:hover:not(:disabled) {
        transform: translateX(-50%) scale(1.1) rotate(2deg);
        box-shadow:
          0 0 40px rgba(255, 102, 0, 0.9),
          0 15px 30px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.4);
        animation-duration: 1s;
      }

      #spinButton:active:not(:disabled) {
        transform: translateX(-50%) scale(0.95);
        box-shadow:
          0 5px 15px rgba(0, 0, 0, 0.3),
          inset 0 2px 5px rgba(0, 0, 0, 0.2);
      }

      #spinButton:focus-visible {
        outline: 3px solid #ffcc66;
        outline-offset: 4px;
      }

      @media (prefers-reduced-motion: reduce) {
        #spinButton {
          animation: none !important;
        }
      }

      .sr-live {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        border: 0;
      }

      #webglFallback {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10000;
        background: #111;
        color: #fff;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        text-align: center;
      }
      #webglFallback[data-visible="true"] {
        display: flex;
      }

      #spinButton:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        animation: none;
        transform: translateX(-50%) scale(0.9);
      }

      .title {
        position: fixed;
        top: 30px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 2.5rem;
        font-weight: 900;
        text-align: center;
        color: var(--text-primary);
        z-index: 1000;
        background: linear-gradient(90deg, #ff6600, #ff4500, #ff8c00);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 10px rgba(255, 102, 0, 0.6));
      }

      @keyframes halloweenPulse {
        0%,
        100% {
          box-shadow:
            0 0 20px rgba(255, 102, 0, 0.6),
            0 10px 25px rgba(0, 0, 0, 0.5),
            inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
        50% {
          box-shadow:
            0 0 40px rgba(255, 102, 0, 0.9),
            0 10px 25px rgba(0, 0, 0, 0.5),
            inset 0 1px 0 rgba(255, 255, 255, 0.3);
        }
      }

      @media (max-width: 768px) {
        .title {
          font-size: 2rem;
          top: 20px;
        }

        #spinButton {
          font-size: 24px;
          padding: 15px 40px;
          bottom: 60px;
        }
      }

      @media (max-width: 480px) {
        .title {
          font-size: 1.5rem;
        }

        #spinButton {
          font-size: 20px;
          padding: 12px 30px;
          min-width: 200px;
        }
      }

      /* Winner Modal Styles */
      .winner-modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 10000;
        opacity: 0;
        visibility: hidden;
        transition:
          opacity 0.3s ease,
          visibility 0.3s ease;
      }

      .winner-modal-overlay.show {
        opacity: 1;
        visibility: visible;
      }

      .winner-modal {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        padding: 40px;
        max-width: 500px;
        width: 90%;
        box-shadow:
          0 8px 32px 0 rgba(31, 38, 135, 0.37),
          inset 0 0 20px rgba(255, 102, 0, 0.1);
        text-align: center;
        transform: scale(0.9);
        transition: transform 0.3s ease;
      }

      .winner-modal-overlay.show .winner-modal {
        transform: scale(1);
      }

      .winner-modal-title {
        font-size: 1.2rem;
        color: rgba(255, 255, 255, 0.7);
        margin-bottom: 20px;
        font-weight: 500;
      }

      .winner-modal-segment {
        font-size: 3rem;
        font-weight: 900;
        background: linear-gradient(90deg, #ff6600, #ff4500, #ff8c00);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 0 10px rgba(255, 102, 0, 0.6));
        margin-bottom: 40px;
        animation: modalSegmentBounce 0.6s ease-in-out;
      }

      @keyframes modalSegmentBounce {
        0% {
          transform: scale(0.8) translateY(10px);
          opacity: 0;
        }
        60% {
          transform: scale(1.05);
        }
        100% {
          transform: scale(1) translateY(0);
          opacity: 1;
        }
      }

      .winner-modal-button {
        background: linear-gradient(135deg, #ff6600, #cc5200);
        color: var(--text-primary);
        border: 2px solid var(--text-primary);
        padding: 15px 40px;
        font-size: 18px;
        font-weight: 900;
        border-radius: 30px;
        cursor: pointer;
        box-shadow:
          0 0 20px rgba(255, 102, 0, 0.6),
          0 5px 15px rgba(0, 0, 0, 0.3);
        transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .winner-modal-button:hover {
        transform: scale(1.08);
        box-shadow:
          0 0 30px rgba(255, 102, 0, 0.8),
          0 10px 20px rgba(0, 0, 0, 0.4);
      }

      .winner-modal-button:active {
        transform: scale(0.95);
      }

      @media (max-width: 768px) {
        .winner-modal {
          padding: 30px;
        }

        .winner-modal-segment {
          font-size: 2.5rem;
        }

        .winner-modal-button {
          font-size: 16px;
          padding: 12px 30px;
        }
      }

      @media (max-width: 480px) {
        .winner-modal {
          padding: 20px;
        }

        .winner-modal-segment {
          font-size: 2rem;
        }

        .winner-modal-button {
          font-size: 14px;
          padding: 10px 25px;
        }
      }
    </style>
  </head>
  <body>
    <main id="main">
      <h1 class="title">Decision Wheel</h1>
      <canvas
        id="c"
        role="img"
        aria-label="Decision wheel. Activate the Spin button to choose a segment."
        tabindex="0"
      ></canvas>
      <div id="spinStatus" class="sr-live" aria-live="polite"></div>
      <button id="spinButton" type="button" aria-busy="false">
        SPIN THE WHEEL!
      </button>
      <div id="webglFallback" role="alert" data-visible="false">
        <p>
          WebGL could not start on this device. Try updating your browser or
          enabling hardware acceleration, then reload.
        </p>
      </div>
    </main>

    <!-- Winner announcement modal -->
    <div
      id="winnerOverlay"
      class="winner-modal-overlay"
      role="dialog"
      aria-modal="true"
      aria-labelledby="winnerTitle"
      aria-hidden="true"
    >
      <div class="winner-modal">
        <h2 id="winnerTitle" class="winner-modal-title">You landed on...</h2>
        <div
          id="winnerSegmentName"
          class="winner-modal-segment"
          aria-live="polite"
        >
          Prize Name
        </div>
        <button id="spinAgainButton" class="winner-modal-button">
          Spin Again
        </button>
      </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "three": "./node_modules/three/build/three.module.js",
          "postprocessing": "./node_modules/postprocessing/build/postprocessing.js"
        }
      }
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
